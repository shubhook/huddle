# Postgres and Redis listen on 127.0.0.1 only. Docker publishes ports on every interface
# by default and that bypasses host firewalls such as ufw, so "5432:5432" meant anyone who
# could reach the machine could try the password. The API reaches them by service name
# inside the Compose network and does not need the published ports at all.
#
# Passwords come from POSTGRES_PASSWORD and REDIS_PASSWORD (shell or a root .env file).
# The "huddle" defaults are for a laptop. Set real values anywhere else, and use URL-safe
# characters (letters and digits), because they are pasted into connection URLs as they are.
# `openssl rand -hex 24` makes a good one. A password with @ / or : breaks the URL.

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./apps/server/.env
    environment:
      # Override the localhost URLs in apps/server/.env, which only work outside Compose.
      DATABASE_URL: postgresql://huddle:${POSTGRES_PASSWORD:-huddle}@postgres:5432/huddle
      REDIS_URL: redis://:${REDIS_PASSWORD:-huddle}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huddle
      # Only applies when the data volume is first created. An existing volume keeps its old
      # password. To change it later, run ALTER USER huddle PASSWORD '...' inside the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huddle}
      POSTGRES_DB: huddle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huddle"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-huddle}
    # The shell form keeps the password out of the process arguments shown by `ps`.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
